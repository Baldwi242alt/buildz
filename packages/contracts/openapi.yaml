components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type: string
          required:
            - code
            - message
            - retryable
            - requestId
      required:
        - error
    Meta:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
      required:
        - requestId
    PageMeta:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
        nextCursor:
          type: string
          nullable: true
      required:
        - requestId
        - nextCursor
    Status:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    ServiceMeta:
      type: object
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        milestones:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties: false
          properties:
            projects:
              type: boolean
            invitations:
              type: boolean
            publicProjects:
              type: boolean
            bookings:
              type: boolean
            liveEvents:
              type: boolean
            proposals:
              type: boolean
            progress:
              type: boolean
            resources:
              type: boolean
            availability:
              type: boolean
            consultations:
              type: boolean
            messages:
              type: boolean
            notifications:
              type: boolean
            vouchers:
              type: boolean
            files:
              type: boolean
          required:
            - projects
            - invitations
            - publicProjects
            - bookings
            - liveEvents
        auth:
          type: object
          additionalProperties: false
          properties:
            issuer:
              type: string
            audience:
              type: string
          required:
            - issuer
            - audience
      required:
        - apiVersion
        - milestones
        - features
        - auth
    Institution:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        currency:
          type: string
        isDemo:
          type: boolean
      required:
        - id
        - name
        - slug
        - timezone
        - currency
        - isDemo
    Membership:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        institutionId:
          type: string
          format: uuid
        affiliation:
          type: string
          enum:
            - student
            - staff
        status:
          type: string
          enum:
            - verified
            - revoked
        validUntil:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - institutionId
        - affiliation
        - status
        - validUntil
    Role:
      type: object
      additionalProperties: false
      properties:
        institutionId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - institution_admin
            - reviewer
            - resource_manager
      required:
        - institutionId
        - role
    Me:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        timezone:
          type: string
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        capabilities:
          type: object
          additionalProperties: false
          properties:
            canCreateProject:
              type: boolean
          required:
            - canCreateProject
      required:
        - id
        - email
        - displayName
        - timezone
        - memberships
        - roles
        - capabilities
    UpdateMe:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: .*\S.*
        timezone:
          type: string
          format: iana-timezone
      minProperties: 1
    ProjectCapabilities:
      type: object
      additionalProperties: false
      properties:
        canEdit:
          type: boolean
        canInvite:
          type: boolean
        canManageMembers:
          type: boolean
        canArchive:
          type: boolean
        canTransferOwnership:
          type: boolean
        canPublish:
          type: boolean
        canSubmitProposal:
          type: boolean
        canReviewProgress:
          type: boolean
        canMessage:
          type: boolean
      required:
        - canEdit
        - canInvite
        - canManageMembers
        - canArchive
        - canTransferOwnership
        - canPublish
        - canSubmitProposal
    Project:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        leadInstitutionId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid

              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Status"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        default:
          description: Structured error; 401 authentication, 403 forbidden, 404 private/missing, 409 conflict, 422 invalid input,
            429 rate limit.
          content:
            application/json:
              schema:

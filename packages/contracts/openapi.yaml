openapi: 3.0.3
info:
  title: BuildZ API
  version: 0.2.1
  description: M0-M6 hackathon backend. Private authenticated workflows and explicit anonymous public projections. All
    times are UTC ISO-8601. Monetary amounts are integer minor units. Notifications use authenticated polling; payments
    are school-managed, not charged by BuildZ. Private file uploads are synchronous, at most 2 MiB per file/50 MiB per
    project, with signature checks but no malware-scan guarantee.
servers:
  - url: http://localhost:3001
    description: Local backend
security:
  - bearerAuth: []
